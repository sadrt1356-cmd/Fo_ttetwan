<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tetwan Foot ⚽ ماتشات تطوان</title>
<style>
:root{--bg:#f4f7f4;--card:#fff;--tx:#14231a;--mu:#5f7266;--ac:#16a34a;--ac2:#0f7a37;--bd:#dfe8e1;--red:#dc2626;--blue:#2563eb;--sh:0 2px 10px rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1510;--card:#14211a;--tx:#e8f2eb;--mu:#8fa597;--bd:#233629;--sh:0 2px 10px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0c1510;--card:#14211a;--tx:#e8f2eb;--mu:#8fa597;--bd:#233629;--sh:0 2px 10px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,#0f7a37,#16a34a);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0f7a37;z-index:10}
header h1{margin:0;font-size:20px;flex:1;cursor:pointer}header small{opacity:.85;font-size:12px}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
button:hover{background:var(--ac2)}button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.red{background:var(--red)}button.blue{background:var(--blue)}button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:12px;color:var(--mu)}
.room{cursor:pointer}.room h3{margin:0 0 4px;font-size:17px}.room .meta{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
.team h4{margin:0 0 8px}.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px dashed var(--bd);margin-bottom:6px;font-size:14px;min-height:40px}
.slot.f{border-style:solid;background:var(--bg);font-weight:600}.slot.me{border-color:var(--ac)}
.A h4{color:var(--red)}.B h4{color:var(--blue)}
.chat{height:260px;overflow-y:auto;background:var(--bg);border-radius:12px;padding:10px;border:1px solid var(--bd)}
.msg{margin-bottom:8px;max-width:85%;padding:6px 10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:14px;word-break:break-word}
.msg.me{margin-inline-start:auto;background:var(--ac);color:#fff;border-color:var(--ac)}.msg b{display:block;font-size:11px;opacity:.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;z-index:30;font-size:14px}
.hero{text-align:center;padding:18px 8px}.hero h2{margin:0 0 4px;font-size:24px}.hero p{margin:0;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:24px}
.warn{background:#fef3c7;color:#78350f;border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<header><h1 onclick="location.hash=''">⚽ Tetwan Foot</h1><small id="who"></small></header>
<div class="wrap" id="app"></div>
<script>
/* Tetwan Foot: الغرف كتتخزن كسجل أحداث فخدمة ntfy.sh المجانية (بلا حساب). كل واحد كيحسب الحالة من السجل، ماكاين حتى مضيف. */
const TOPIC='tetwanfoot-v1-k7q2x9',BASE='https://ntfy.sh/'+TOPIC;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
const fmtDate=(d,t)=>{if(!d)return '';try{return new Date(d+'T00:00').toLocaleDateString('ar-MA-u-nu-latn',{weekday:'short',day:'numeric',month:'short'})+(t?' · '+t:'')}catch(e){return d+' '+(t||'')}};
const total=r=>r.A.length+r.B.length,cap=r=>r.size*2,rid=()=>Math.random().toString(36).slice(2,10);
const ended=r=>{const t=new Date((r.date||'')+'T'+(r.time||'00:00')).getTime();return t&&Date.now()>t+5*36e5};
let me=JSON.parse(ls.get('tf_me')||'null'),events=[],seen=new Set(),byRoom={},curId=null,online=false,st=null;
function index(e){if(!e||!e.e||!e.room||seen.has(e.e))return false;seen.add(e.e);(byRoom[e.room]=byRoom[e.room]||[]).push(e);return true}
try{events=JSON.parse(ls.get('tf_ev2')||'[]')}catch(e){events=[]}
events=events.filter(index);
function persist(){const cut=Date.now()-48*36e5;events=events.filter(e=>e.ts>cut).slice(-600);ls.set('tf_ev2',JSON.stringify(events))}
function sched(){clearTimeout(st);st=setTimeout(render,120)}
function add(e){if(index(e)){events.push(e);persist();if(!curId||curId===e.room)sched()}}
async function pub(ev){
  ev.e=rid();ev.ts=Date.now();add(ev);
  const body=JSON.stringify(ev);if(body.length>3900)return toast('البيانات كبيرة بزاف');
  try{const r=await fetch(BASE,{method:'POST',body});if(!r.ok)throw 0}catch(x){toast('ما تصيفطاتش، شوف الإنترنت')}
}
/* حالة الغرفة من السجل */
function state(id){
  const ev=(byRoom[id]||[]).slice().sort((a,b)=>a.ts-b.ts);
  let bi=-1;ev.forEach((e,i)=>{if(e.t==='snap'||e.t==='new')bi=i});
  if(bi<0)return{r:null,msgs:[],base:0};
  const b=ev[bi];let r={...b.r,A:[...b.r.A],B:[...b.r.B]};
  for(const e of ev.slice(bi+1)){
    if(e.t==='del'&&e.id===r.hostId){r=null;break}
    if(e.t==='close'&&e.id===r.hostId)r.status='closed';
    else if(e.t==='open'&&e.id===r.hostId)r.status='open';
    else if(e.t==='leave'){r.A=r.A.filter(p=>p.id!==e.id);r.B=r.B.filter(p=>p.id!==e.id)}
    else if(e.t==='join'){
      const L=e.team==='A'?r.A:r.B;if(L.some(p=>p.id===e.id)||L.length>=r.size)continue;
      r.A=r.A.filter(p=>p.id!==e.id);r.B=r.B.filter(p=>p.id!==e.id);
      (e.team==='A'?r.A:r.B).push({id:e.id,name:String(e.name).slice(0,20),phone:e.phone||''});
    }
  }
  const msgs=ev.filter(e=>e.t==='chat').slice(-100);
  return{r,msgs,base:b.ts};
}
function allRooms(){return Object.keys(byRoom).map(id=>state(id).r).filter(r=>r&&r.status!=='closed'&&!ended(r)).sort((a,b)=>b.ts-a.ts)}
/* اتصال مباشر */
function connect(){
  const es=new EventSource(BASE+'/sse?since=12h');
  es.onopen=()=>{online=true;stat()};es.onerror=()=>{online=false;stat()};
  es.onmessage=m=>{try{const d=JSON.parse(m.data);if(d.event==='message')add(JSON.parse(d.message))}catch(x){}};
  setTimeout(compact,6000);
}
/* تجديد: كل غرفة كتتعاود تتنشر باش ما تضيعش من الكاش (12 ساعة) */
function compact(){
  let n=0;
  for(const id in byRoom){const s=state(id);if(!s.r||s.r.status==='closed'||ended(s.r)||Date.now()-s.base<3*36e5||n>=8)continue;
    setTimeout(()=>pub({t:'snap',room:id,r:s.r}),n++*1500)}
}
function stat(){const w=$('#who');if(w)w.textContent=(me?me.name+' · ':'')+(online?'🟢':'🔴')}
/* واجهة */
function render(){
  stat();const a=$('#app');
  if(!me){a.innerHTML='';loginModal();return}
  if(curId)return renderRoom(a);
  if(location.hash==='#new')return renderNew(a);
  renderHome(a);
}
function route(){const m=location.hash.match(/^#r-(\w+)$/);curId=m?m[1]:null;render()}
function loginModal(){
  if($('#login'))return;
  const d=document.createElement('div');d.className='modal';d.id='login';
  d.innerHTML=`<div class="card" style="width:100%;max-width:380px"><div class="hero"><h2>مرحبا بيك فتطوان فوت ⚽</h2><p>دخل سميتك ورقم التيليفون باش تبدا تلعب</p></div>
  <label>السمية</label><input id="ln" maxlength="20" placeholder="مثلا: يوسف">
  <label>رقم التيليفون</label><input id="lp" inputmode="tel" maxlength="14" placeholder="06XXXXXXXX" dir="ltr">
  <p style="font-size:12px;color:var(--mu)">الرقم كيبقى فجهازك وما كيبانش لحد حتى كتختار نتا تبينو فغرفة.</p>
  <button style="width:100%" id="lg">دخل</button></div>`;
  document.body.appendChild(d);
  $('#lg').onclick=()=>{
    const name=$('#ln').value.trim(),phone=$('#lp').value.replace(/[\s.-]/g,'');
    if(name.length<2)return toast('كتب سميتك');
    if(!/^(\+212|0)[5-7]\d{8}$/.test(phone))return toast('رقم التيليفون ماشي صحيح');
    me={name,phone,id:'u'+rid()};ls.set('tf_me',JSON.stringify(me));d.remove();render();
  };
}
function roomCard(r){
  const n=total(r),c=cap(r),full=n>=c;
  return `<div class="card room" data-id="${esc(r.id)}"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(r.title)}</h3><span class="tag">${r.size} ضد ${r.size}</span></div>
  <div class="meta">📍 ${esc(r.terrain)} · 🕒 ${esc(fmtDate(r.date,r.time))}${r.price?' · 💰 '+esc(r.price)+' درهم':''}</div><div class="meta">👑 ${esc(r.hostName)}</div>
  <div class="bar"><i style="width:${Math.min(100,n/c*100)}%"></i></div><div class="meta" style="margin-top:4px">${full?'🔴 كاملة':'🟢 '+n+'/'+c+' لاعب'}</div></div>`;
}
function renderHome(a){
  const open=allRooms();
  a.innerHTML=`<div class="hero"><h2>ماتشات عشوائية فتطوان 🔥</h2><p>دير غرفة ولا دخل لماتش، لقا ناس وشعل الملعب</p></div>
  <div class="row" style="margin-bottom:12px"><button id="nw">➕ دير غرفة</button><button class="blue" id="rd">🎲 ماتش عشوائي</button></div>
  <div class="card"><label style="margin-top:0">عندك رابط غرفة؟</label><div class="row"><input id="cd" placeholder="الصق الرابط ولا الكود" style="flex:3"><button class="sec" id="go" style="flex:1">دخل</button></div></div>
  ${online?'':'<div class="warn">كنتّصل بالسيرفر... إيلا طوّل شوف الإنترنت.</div>'}
  <h3 style="margin:16px 0 8px">الغرف المفتوحة (${open.length})</h3>
  ${open.length?open.map(roomCard).join(''):'<div class="empty">ما كاين حتى غرفة دابا. كون نتا الأول! ⚽</div>'}
  <div style="text-align:center;margin-top:14px"><button class="sec" id="lo">خروج</button></div>`;
  $('#nw').onclick=()=>location.hash='#new';
  $('#rd').onclick=()=>{const c=open.filter(r=>total(r)<cap(r)).sort((x,y)=>total(y)-total(x));if(!c.length){toast('ما كاين حتى ماتش، دير نتا غرفة!');location.hash='#new'}else location.hash='#r-'+c[0].id};
  $('#go').onclick=()=>{let v=$('#cd').value.trim();const m=v.match(/r-(\w+)/);v=m?m[1]:v;if(v)location.hash='#r-'+v};
  $('#lo').onclick=()=>{ls.set('tf_me','');me=null;render()};
  a.querySelectorAll('.room').forEach(el=>el.onclick=()=>location.hash='#r-'+el.dataset.id);
}
function renderNew(a){
  const today=new Date().toISOString().slice(0,10);
  a.innerHTML=`<div class="card"><h3 style="margin-top:0">غرفة جديدة ⚽</h3>
  <label>سمية الماتش</label><input id="t" maxlength="40" placeholder="مثلا: ماتش العشية فالمارتيل">
  <label>الملعب</label><input id="g" maxlength="60" placeholder="سمية الملعب والحي">
  <div class="grid2"><div><label>النهار</label><input id="d" type="date" min="${today}" value="${today}"></div><div><label>الوقت</label><input id="h" type="time" value="20:00"></div></div>
  <div class="grid2"><div><label>النظام</label><select id="s"><option value="5">5 ضد 5</option><option value="4">4 ضد 4</option><option value="3">3 ضد 3</option><option value="6">6 ضد 6</option></select></div>
  <div><label>الثمن للاعب (درهم)</label><input id="p" type="number" min="0" placeholder="اختياري"></div></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="ph" style="width:auto"> بين رقمي للاعبين فالغرفة</label>
  <div class="row" style="margin-top:14px"><button id="ok">دير الغرفة</button><button class="sec" id="cn">رجع</button></div></div>`;
  $('#cn').onclick=()=>location.hash='';
  $('#ok').onclick=()=>{
    const title=$('#t').value.trim(),terrain=$('#g').value.trim();
    if(!title||!terrain)return toast('عمر السمية والملعب');
    me.showPhone=$('#ph').checked;ls.set('tf_me',JSON.stringify(me));
    const id=rid().slice(0,6);
    pub({t:'new',room:id,r:{id,title,terrain,date:$('#d').value,time:$('#h').value,size:+$('#s').value,price:$('#p').value,hostId:me.id,hostName:me.name,status:'open',ts:Date.now(),A:[{id:me.id,name:me.name,phone:me.showPhone?me.phone:''}],B:[]}});
    location.hash='#r-'+id;
  };
}
function slots(r,k){
  const out=[];
  for(let i=0;i<r.size;i++){const p=r[k][i];
    out.push(p?`<div class="slot f ${p.id===me.id?'me':''}">👤 ${esc(p.name)}${p.id===r.hostId?' 👑':''}${p.phone?` <a href="tel:${esc(p.phone)}" style="margin-inline-start:auto;font-size:12px" dir="ltr">${esc(p.phone)}</a>`:''}</div>`:`<div class="slot" style="color:var(--mu)">⚪ بلاصة خاوية</div>`)}
  return out.join('');
}
function renderRoom(a){
  const s=state(curId),r=s.r,msgs=s.msgs;
  if(!r){a.innerHTML='<div class="card empty">'+(online?'هاد الغرفة ما لقيناهاش (يمكن تمسحات ولا فات عليها الوقت) 😕':'كنقلب على الغرفة...')+'<br><br><button id="bk">رجع للرئيسية</button></div>';$('#bk').onclick=()=>location.hash='';return}
  const inA=r.A.some(p=>p.id===me.id),inB=r.B.some(p=>p.id===me.id),inn=inA||inB,host=r.hostId===me.id,closed=r.status==='closed';
  const keep=$('#msgtxt')?$('#msgtxt').value:'';
  a.innerHTML=`<button class="sec" id="bk" style="margin-bottom:10px">→ الرئيسية</button>
  <div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h2 style="margin:0;font-size:20px">${esc(r.title)}</h2><span class="tag">${r.size} ضد ${r.size}</span></div>
  <div style="color:var(--mu);margin-top:6px">📍 ${esc(r.terrain)}<br>🕒 ${esc(fmtDate(r.date,r.time))}${r.price?'<br>💰 '+esc(r.price)+' درهم للاعب':''}<br>👑 ${esc(r.hostName)}</div>
  ${closed?'<p style="color:var(--red);font-weight:700">🔒 الغرفة تسدات</p>':''}
  <div class="row" style="margin-top:10px"><button class="sec" id="cp">🔗 كوبي الرابط</button><button class="blue" id="wa">واتساب</button></div></div>
  <div class="grid2"><div class="card team A"><h4>🔴 الفريق A (${r.A.length}/${r.size})</h4>${slots(r,'A')}${!closed&&!inA?'<button style="width:100%" id="jA">ندخل A</button>':''}</div>
  <div class="card team B"><h4>🔵 الفريق B (${r.B.length}/${r.size})</h4>${slots(r,'B')}${!closed&&!inB?'<button class="blue" style="width:100%" id="jB">ندخل B</button>':''}</div></div>
  <div class="row">${inn&&!closed?'<button class="sec" id="lv">🚪 نخرج من الماتش</button>':''}${host?`<button class="sec" id="cl">${closed?'🔓 عاود حل':'🔒 سد الغرفة'}</button><button class="red" id="dl">🗑️ مسح</button>`:''}</div>
  <div class="card" style="margin-top:12px"><h3 style="margin-top:0">💬 الشات</h3><div class="chat" id="chat"></div>
  <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="msgtxt" maxlength="300" placeholder="كتب رسالة..." style="flex:4"><button id="snd" style="flex:1">صيفط</button></div></div>`;
  $('#msgtxt').value=keep;
  $('#bk').onclick=()=>location.hash='';
  $('#cp').onclick=()=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('تكوبى الرابط ✅')).catch(()=>prompt('كوبي الرابط:',u))};
  $('#wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(`يالاه نلعبو! ${r.title} - ${r.terrain} ${fmtDate(r.date,r.time)}\n${location.href}`),'_blank');
  const join=t=>{
    if(t&&me.showPhone===undefined){me.showPhone=confirm('بغيتي لاعبين فهاد الغرفة يشوفو رقمك باش يتواصلو معاك؟');ls.set('tf_me',JSON.stringify(me))}
    if(t&&(t==='A'?r.A:r.B).length>=r.size)return toast('هاد الفريق عامر');
    pub({t:t?'join':'leave',room:r.id,team:t,id:me.id,name:me.name,phone:me.showPhone?me.phone:''});
  };
  const ja=$('#jA'),jb=$('#jB'),lv=$('#lv'),cl=$('#cl'),dl=$('#dl');
  ja&&(ja.onclick=()=>join('A'));jb&&(jb.onclick=()=>join('B'));lv&&(lv.onclick=()=>join(null));
  cl&&(cl.onclick=()=>pub({t:closed?'open':'close',room:r.id,id:me.id}));
  dl&&(dl.onclick=()=>{if(confirm('تمسح الغرفة؟')){pub({t:'del',room:r.id,id:me.id});location.hash=''}});
  const send=()=>{const i=$('#msgtxt'),text=i.value.trim().slice(0,300);if(!text)return;i.value='';pub({t:'chat',room:r.id,uid:me.id,name:me.name,text})};
  $('#snd').onclick=send;$('#msgtxt').onkeydown=e=>{if(e.key==='Enter')send()};
  const box=$('#chat');
  box.innerHTML=msgs.length?msgs.map(m=>`<div class="msg ${m.uid===me.id?'me':''}"><b>${esc(m.name)}</b>${esc(m.text)}</div>`).join(''):'<div class="empty" style="padding:50px 0">بدا النقاش، ساليو الترتيبات 👋</div>';
  box.scrollTop=box.scrollHeight;
}
addEventListener('hashchange',route);
route();connect();
</script>
</body>
</html>
